<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gland + PZ DICOM catalog</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header>
    <h1>Prostate gland + peripheral zone</h1>
    <p class="sub">
      DICOM catalog from <code>studies_with_masks</code> → <code>dicom/</code>.
      Teal = gland (TZ+CZ), amber = PZ. Series are symlinked; nothing is copied from ProCAncer-I.
    </p>
    <div class="controls">
      <label><input type="checkbox" id="ready-only" checked /> ready only (T2 + zone SEG)</label>
      <label><input type="checkbox" id="hide-discarded" /> hide discarded</label>
      <input id="search" type="search" placeholder="filter patient / study…" />
      <span id="stats"></span>
    </div>
  </header>
  <main id="grid"></main>
  <script src="/static/app.js"></script>
</body>
</html>
